version: 2
services:
  - type: web
    name: floorplan3d-backend
    runtime: python3
    rootDir: ./backend
    buildCommand: pip install -r requirements.txt && python download_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    env: python
    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MODEL_WEIGHTS_URL
        sync: false  # Set this in Render dashboard to your model download URL